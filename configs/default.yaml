# Default Configuration for Hallucination Detection Pipeline

model:
  # Local project path or HuggingFace ID
  name: "models/Qwen2.5-1.5B-Instruct"
  device: "auto"          # "auto", "cuda", "cpu"
  torch_dtype: "float16"   # "float16", "bfloat16", "float32"
  load_in_4bit: false      # set to true if VRAM is constrained

generation:
  max_new_tokens: 32
  temperature: 0.7
  top_p: 0.9
  num_samples: 5           # N stochastic samples per question
  # Prompt template enforcing concise answers without explanations
  prompt_template: "Answer the following question in a few words without explanation.\n\nQuestion: {question}\nAnswer:"

nli:
  # NLI model for semantic entropy equivalence clustering
  model_name: "microsoft/deberta-large-mnli"
  batch_size: 16
  use_string_fallback: false # If True or NLI unavailable, use normalized string clustering

data:
  triviaqa_samples: 2000    # Default subset size (scale to 5000-10000 as needed)
  truthfulqa_samples: 817   # OOD evaluation dataset
  train_split: 0.60         # 60% train
  cal_split: 0.15           # 15% calibration (never touches test)
  test_split: 0.25          # 25% test
  seed: 42

features:
  # Layer indices for hidden state extraction (-1 is the final layer)
  probe_layers: [4, 8, 12, 16, 20, 24, -1]
  # Token position to extract hidden state: "last_answer" (default), "last_prompt", or "first_answer"
  probe_token_position: "last_answer"

evaluation:
  bootstrap_iterations: 1000
  confidence_level: 0.95
  ece_bins: 10
  risk_coverage_points: 100
